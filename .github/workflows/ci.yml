name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python 3.12 / Node LTS
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Prepare safe CI configuration
        shell: bash
        run: cp .env.example .env

      - name: Run full unittest suite
        env:
          DASHSCOPE_API_KEY: ci-test-placeholder
        run: python -W ignore -m unittest discover -s tests -q

      - name: Compile Python sources
        run: python -m compileall -q app schemas main.py

      - name: Check frontend JavaScript
        run: node --check frontend/app.js
